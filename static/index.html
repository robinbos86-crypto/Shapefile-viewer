<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shapefile Viewer</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #topbar {
            padding: 15px;
            background: #f2f2f2;
            border-bottom: 1px solid #ccc;
        }

        #map {
            height: calc(100vh - 75px);
        }

        #status {
            margin-left: 15px;
        }
    </style>
</head>

<body>

<div id="topbar">

    <input
        type="file"
        id="fileInput"
        accept=".zip"
    >

    <button onclick="uploadFile()">
        Upload Shapefile
    </button>

    <span id="status"></span>

</div>

<div id="map"></div>

<!-- Leaflet -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

    // Kaart maken
    const map = L.map("map").setView(
        [52.1326, 5.2913],
        7
    );

    // OpenStreetMap achtergrond
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    // Hier bewaren we de huidige Shapefile
    let shapefileLayer = null;


    async function uploadFile() {

        const input = document.getElementById("fileInput");
        const status = document.getElementById("status");

        if (input.files.length === 0) {
            alert("Selecteer eerst een ZIP-bestand.");
            return;
        }

        const file = input.files[0];

        status.innerText = "Bezig met uploaden...";

        const formData = new FormData();

        formData.append("file", file);


        try {

            const response = await fetch(
                "/upload",
                {
                    method: "POST",
                    body: formData
                }
            );


            const result = await response.json();


            if (!response.ok) {
                throw new Error(result.detail);
            }


            // JSON-string omzetten naar object
            const geojson = JSON.parse(result.geojson);


            // Oude laag verwijderen
            if (shapefileLayer) {
                map.removeLayer(shapefileLayer);
            }


            // Nieuwe GeoJSON-laag maken
            shapefileLayer = L.geoJSON(
                geojson,
                {

                    style: {
                        color: "#3388ff",
                        weight: 2,
                        fillOpacity: 0.3
                    },

                    onEachFeature: function(feature, layer) {

                        // Attributen van de Shapefile
                        if (feature.properties) {

                            let html = "<b>Objectgegevens</b><br><br>";

                            for (
                                const [key, value]
                                of Object.entries(feature.properties)
                            ) {

                                html +=
                                    `<b>${key}</b>: ${value}<br>`;
                            }

                            layer.bindPopup(html);
                        }
                    }

                }
            ).addTo(map);


            // Kaart automatisch naar objecten laten gaan
            const bounds = shapefileLayer.getBounds();

            if (bounds.isValid()) {
                map.fitBounds(bounds);
            }


            status.innerText =
                `${result.features} object(en) geladen.`;

        }

        catch (error) {

            console.error(error);

            status.innerText = "Fout";

            alert(
                "Er is een fout opgetreden:\n\n"
                + error.message
            );
        }
    }

</script>

</body>
</html>
